<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daftar Buku</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #222;
            max-width: 700px;
            margin: 0 auto;
            padding: 32px 20px;
        }
        h1 { font-size: 26px; margin: 0 0 16px; }
        h2 { font-size: 18px; margin: 24px 0 8px; }
        form { display: flex; gap: 6px; max-width: 480px; }
        input {
            flex: 1;
            padding: 7px 9px;
            border: 1px solid #bbb;
            border-radius: 4px;
            font-size: 14px;
        }
        input[type="number"] { max-width: 70px; }
        button, .btn {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 7px 16px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
        }
        button:hover, .btn:hover { background: #1557b0; }
        table { border-collapse: collapse; margin-top: 14px; min-width: 340px; }
        th, td { padding: 8px 14px; border: 1px solid #ccc; text-align: left; }
        th { background: #f2f2f2; }
        .nav { margin-top: 20px; }
    </style>
</head>
<body>
<h1>Daftar Buku</h1>

<form th:action="@{/buku}" method="get">
    <input name="kata" th:value="${kata}" placeholder="Cari judul">
    <button type="submit">Cari</button>
</form>

<table>
    <tr><th>ID</th><th>Judul</th><th>Stok</th></tr>
    <tr th:each="b : ${daftarBuku}">
        <td th:text="${b.idBuku}">B001</td>
        <td th:text="${b.judul}">Judul buku</td>
        <td th:text="${b.stok}">0</td>
    </tr>
</table>

<h2>Tambah Buku</h2>
<form th:action="@{/buku}" method="post">
    <input name="idBuku" placeholder="ID" required>
    <input name="judul" placeholder="Judul" required>
    <input name="stok" type="number" min="0" value="1">
    <button type="submit">Simpan</button>
</form>

<div class="nav">
    <a th:href="@{/anggota}" class="btn">Lihat Anggota</a>
</div>
</body>
</html>
